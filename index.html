<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AOH-FOD V1100 PRO</title>
    <style>
        :root { --green: #0f0; --red: #f00; --blue: #0088ff; }
        body { background: #000; color: #eee; font-family: sans-serif; margin: 0; padding: 10px; text-align: center; display: flex; flex-direction: column; height: 100vh; overflow: hidden; box-sizing: border-box; }
        
        .lang-bar { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 10px; flex-shrink: 0; }
        .l-btn { background: #111; color: var(--green); border: 1px solid var(--green); padding: 5px 12px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; }
        .l-btn.active { background: var(--green); color: #000; font-weight: bold; }
        .c-btn { background: #151515; color: #fff; border: 1px solid #333; padding: 5px 12px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; font-weight: bold; }

        .header { border: 2px solid var(--green); padding: 8px; border-radius: 10px; color: var(--green); font-weight: bold; margin-bottom: 8px; font-size: 0.7rem; flex-shrink: 0; }
        .scanner { width: 105px; height: 105px; border: 2px solid var(--green); border-radius: 50%; margin: 0 auto 5px; overflow: hidden; position: relative; background: #111; flex-shrink: 0; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 1; background: #222; }
        .laser { position: absolute; width: 100%; height: 3px; background: var(--red); top: 50%; box-shadow: 0 0 12px red; display: none; animation: scanAnim 2s infinite; z-index: 5; }
        @keyframes scanAnim { 0%, 100% { top: 20%; } 50% { top: 80%; } }
        
        .table-container { flex-grow: 1; overflow-y: auto; margin-top: 5px; border: 1px solid #222; -webkit-overflow-scrolling: touch; display: none; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; background: #050505; font-size: 0.65rem; }
        thead th { position: sticky; top: 0; background: #151515; color: var(--green); z-index: 10; padding: 10px 4px; border-bottom: 2px solid var(--green); }
        td { padding: 8px 4px; border-bottom: 1px solid #111; }
        
        .btn-main { width: 100%; padding: 18px; background: var(--green); border: none; border-radius: 40px; font-weight: bold; font-size: 0.85rem; margin: 10px 0; cursor: pointer; color: #000; flex-shrink: 0; }
        .wa-area { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; flex-shrink: 0; display: none; }
        .wa { padding: 14px 5px; border-radius: 30px; color: #fff; text-decoration: none; font-weight: bold; font-size: 0.6rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .info-btns { display: flex; gap: 5px; margin-top: 8px; flex-shrink: 0; padding-bottom: 15px; }
        .panel-btn { background: #111; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 8px; flex: 1; font-size: 0.55rem; cursor: pointer; }
        .panel { display: none; padding: 10px; border: 1px solid #222; margin-top: 8px; border-radius: 10px; text-align: left; font-size: 0.72rem; color: var(--green); line-height: 1.3; }
        
        /* Fereastra Pop-up independentă pentru Info Concept */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; padding: 20px; box-sizing: border-box; justify-content: center; align-items: center; }
        .modal-content { background: #0a0a0a; border: 2px solid var(--green); border-radius: 15px; padding: 20px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; text-align: left; font-size: 0.78rem; line-height: 1.4; color: #eee; position: relative; }
        .modal-content h3 { color: var(--green); margin-top: 0; border-bottom: 1px solid var(--green); padding-bottom: 8px; font-size: 0.95rem; text-align: center; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: var(--red); font-size: 1.4rem; cursor: pointer; font-weight: bold; }
        .modal-content hr { border: 0; border-top: 1px solid #222; margin: 12px 0; }
        
        .footer-space { height: 60px; flex-shrink: 0; }

</head>
<body>

<script>

const langData = {

        tn:"NUTRIENT", to:"OPTIM", ts:"SCANAT", td:"NECESAR", ws:"🛒 CUMPĂRĂTURI", wc:"👨‍🍳 EXEMPLU MENIU",

        m_title: "🧬 CONCEPT AOH-FOD V1100 PRO",
        m_body: `<p style="color:var(--green); text-align:center; font-style:italic;">Potrivirea perfectă între chimia corpului tău și farfuria din față.</p>

                    <li><strong>Etapa 2 (Viitor):</strong> Dispozitiv fizic de scanare hibridă offline (în lucru). Va asigura o precizie de peste 80-90% și va scana inclusiv mâncarea din farfurie pentru a verifica nutrienții rămași după gătire. Disponibil la preț minim de producție, fără abonamente.</li>
                 </ul>
                 <hr>
                 <p><strong>📖 GHID RAPID DE UTILIZARE (Acuratețe 60%):</strong></p>
                 <p>1. Așază <strong>degetul arătător</strong> astfel încât să acopere <strong>complet și simultan</strong> atât lentila camerei foto, cât și blițul telefonului.<br>
                 2. Asigură-te că degetul sigilează perfect zona, blocând lumina din afară.<br>
                 3. Menține degetul nemișcat timp de 10 secunde, dar <strong>fără să apeși tare</strong> (apăsarea oprește fluxul sanguin capilar și distorsionează datele).</p>
                 <hr>
                 <p><strong>🔒 CONFIDENȚIALITATE & SECURITATE:</strong></p>
                 <p>Întregul algoritm rulează complet local și offline, direct pe dispozitivul tău. Fără baze de date în cloud și fără conexiuni externe la internet. Datele tale rămân mereu ale tale.</p>`,
        err:"Eroare cameră sau permisiune refuzată!"
    },
    en: {
        h:"AOH-FOD: FOOD OPTIMIZATION", sb:"🧬 START SCAN (10 SEC)", sc:"⏳ BIOMETRIC ANALYSIS: ", sd:"✅ SCAN SUCCESSFUL",
        tn:"NUTRIENT", to:"OPTIMAL", ts:"SCANNED", td:"REQUIRED", ws:"🛒 SHOPPING LIST", wc:"👨‍🍳 MEAL EXAMPLE",
        b1:"🌍 PLANET", b2:"💰 ECONOMY", b3:"🎾 TENNIS DEVA", bc:"ℹ️ INFO CONCEPT",
        p1:"🌍 IMPACT: Zero waste. Surgical consumption for the planet and global pollution reduction.",
        p2:"💰 ECONOMY: Buy strictly the foods that contain the nutrients you lack.",
        p3:"🎾 TENNIS DEVA: Accelerated biochemical recovery after physical or intellectual training.",
        m_title: "🧬 AOH-FOD V1100 PRO CONCEPT",
        m_body: `<p style="color:var(--green); text-align:center; font-style:italic;">The perfect match between your body chemistry and the plate in front of you.</p>
                 <p><strong>AOH-FOD PRO</strong> is an advanced, non-medical digital concept created for real-time food optimization. In just 10 seconds, the system mathematically calculates the "unique recipe" your body needs for maximum performance and accelerated biochemical recovery (ideal for athletes and Deva Tennis fans).</p>
                 <hr>
                 <p><strong>📈 DEVELOPMENT PHASE & ACCURACY:</strong></p>
                 <ul>
                    <li><strong>Stage 1 (Present - FREE):</strong> Instant smartphone scanning. Provides up to <strong>60% accuracy</strong>, serving as an excellent baseline guide in stores or at the table.</li>
                    <li><strong>Stage 2 (Future):</strong> Offline hybrid physical scanning device (under development). It will ensure 80-90%+ accuracy and will even scan the food on your plate to verify remaining nutrients after cooking. Available at a minimum production cost, subscription-free.</li>
                 </ul>
                 <hr>
                 <p><strong>📖 QUICK USER GUIDE (60% Accuracy):</strong></p>
                 <p>1. Place your <strong>index finger</strong> to <strong>completely and simultaneously</strong> cover both the camera lens and the phone flash.<br>
                 2. Ensure your finger perfectly seals the area, blocking external light.<br>
                 3. Keep your finger still for 10 seconds, but <strong>do not press hard</strong> (heavy pressure stops capillary blood flow and distorts data).</p>
                 <hr>
                 <p><strong>🔒 PRIVACY & SECURITY:</strong></p>
                 <p>The entire algorithm runs completely locally and offline, directly on your device. No cloud databases, no external internet connections. Your data stays yours.</p>`,
        err:"Camera error or permission denied!"
    }
};

const nutrients = [
    {ro:'💧 Hidratare', en:'💧 Hydration', opt:100, u:'%', f_ro:'Apă/Lămâie', f_en:'Water/Lemon', cat_ro:'Lichide', cat_en:'Fluids'},
    {ro:'🔋 Vitamina B1', en:'🔋 Vitamin B1', opt:1.2, u:'mg', f_ro:'Mazăre/Porumb', f_en:'Peas/Corn', cat_ro:'Legume/Băcănie', cat_en:'Vegetables/Grocery'},
    {ro:'🔋 Vitamina B2', en:'🔋 Vitamin B2', opt:1.3, u:'mg', f_ro:'Migdale/Ciuperci', f_en:'Almonds/Mushrooms', cat_ro:'Legume/Băcănie', cat_en:'Vegetables/Grocery'},
    {ro:'🧬 Vitamina B3', en:'🧬 Vitamin B3', opt:16, u:'mg', f_ro:'Curcan/Arahide', f_en:'Turkey/Peanuts', cat_ro:'Măcelărie/Nuci', cat_en:'Butcher/Nuts'},
    {ro:'🔋 Vitamina B5', en:'🔋 Vitamin B5', opt:5, u:'mg', f_ro:'Avocado/Ouă', f_en:'Avocado/Eggs', cat_ro:'Produse Proaspete', cat_en:'Fresh Produce'},
    {ro:'🔋 Vitamina B6', en:'🔋 Vitamin B6', opt:1.3, u:'mg', f_ro:'Năut/Cartof', f_en:'Chickpeas/Potato', cat_ro:'Legume/Băcănie', cat_en:'Vegetables/Grocery'},
    {ro:'🔋 Vitamina B7', en:'🔋 Vitamin B7', opt:30, u:'µg', f_ro:'Nuci/Gălbenuș', f_en:'Nuts/Egg Yolk', cat_ro:'Produse Proaspete', cat_en:'Fresh Produce'},
    {ro:'🌿 B9 (Folați)', en:'🌿 B9 (Folate)', opt:400, u:'µg', f_ro:'Linte/Sparanghel', f_en:'Lentils/Asparagus', cat_ro:'Legume/Băcănie', cat_en:'Vegetables/Grocery'},
    {ro:'🧠 Vitamina B12', en:'🧠 Vitamin B12', opt:2.4, u:'µg', f_ro:'Ouă/Carne', f_en:'Eggs/Meat', cat_ro:'Măcelărie/Lactate', cat_en:'Butcher/Dairy'},
    {ro:'⚡ Coenzima Q10', en:'⚡ Coenzyme Q10', opt:100, u:'mg', f_ro:'Vită/Pește/Spanac', f_en:'Beef/Fish/Spinach', cat_ro:'Măcelărie/Pește', cat_en:'Butcher/Fish'},
    {ro:'💪 Proteine', en:'💪 Protein', opt:80, u:'g', f_ro:'Pui/Mazăre', f_en:'Chicken/Peas', cat_ro:'Măcelărie/Băcănie', cat_en:'Butcher/Grocery'},
    {ro:'🦴 Colagen', en:'🦴 Collagen', opt:10, u:'g', f_ro:'Supă Oase/Pește', f_en:'Bone Broth/Fish', cat_ro:'Măcelărie/Pește', cat_en:'Butcher/Fish'},
    {ro:'🐟 Omega 3', en:'🐟 Omega 3', opt:1000, u:'mg', f_ro:'Somon/Semințe In', f_en:'Salmon/Flaxseeds', cat_ro:'Pește/Băcănie', cat_en:'Fish/Grocery'}
];

function playTone(freq, type, duration) {
    try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function chLang(lang) {
    curLang = lang;
    document.getElementById('b-ro').classList.toggle('active', lang === 'ro');
    document.getElementById('b-en').classList.toggle('active', lang === 'en');
    
    document.getElementById('h-txt').innerText = langData[lang].h;
    document.getElementById('s-btn').innerText = langData[lang].sb;
    document.getElementById('th-n').innerText = langData[lang].tn;
    document.getElementById('th-o').innerText = langData[lang].to;
    document.getElementById('th-s').innerText = langData[lang].ts;
    document.getElementById('th-d').innerText = langData[lang].td;
    document.getElementById('w-shop').innerText = langData[lang].ws;
    document.getElementById('w-cook').innerText = langData[lang].wc;
    document.getElementById('p1-b').innerText = langData[lang].b1;
    document.getElementById('p2-b').innerText = langData[lang].b2;
    document.getElementById('p3-b').innerText = langData[lang].b3;
    document.getElementById('b-con').innerText = langData[lang].bc;
    document.getElementById('p-pl').innerText = langData[lang].p1;
    document.getElementById('p-ec').innerText = langData[lang].p2;
    document.getElementById('p-tn').innerText = langData[lang].p3;
}

/* Functii izolate pentru controlul pop-up-ului de informatii */
function openModal() {
    document.getElementById('m-title').innerText = langData[curLang].m_title;
    document.getElementById('m-body').innerHTML = langData[curLang].m_body;
    document.getElementById('c-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('c-modal').style.display = 'none';
}

window.onclick = function(event) {
    let modal = document.getElementById('c-modal');
    if (event.target == modal) {
        modal.style.display = 'none';
    }
}

async function startScan() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const btn = document.getElementById('s-btn');
    const laser = document.getElementById('lsr');
    const video = document.getElementById('v');
    
    btn.disabled = true;
    laser.style.display = 'block';
    
    try {
        streamRef = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = streamRef;
    } catch (err) {
        console.log(langData[curLang].err);
    }

    let timeLeft = 10;
    let scanInterval = setInterval(() => {
        timeLeft--;
        btn.innerText = langData[curLang].sc + timeLeft + "s";
        playTone(880, 'sine', 0.05);
    }, 1000);

    setTimeout(() => {
        clearInterval(scanInterval);
        btn.innerText = langData[curLang].sd;
        laser.style.display = 'none';
        btn.disabled = false;
        playTone(1200, 'triangle', 0.3);
        
        if (streamRef) {
            streamRef.getTracks().forEach(track => track.stop());
        }

        generateResults();
    }, 10000);
}

function generateResults() {
    const tbody = document.getElementById('res-b');
    tbody.innerHTML = '';
    
    // Structura fixa pe Raioane pentru generarea textului WhatsApp
    let categorii = {
        "Lichide": [],
        "Legume/Băcănie": [],
        "Măcelărie/Nuci": [],
        "Produse Proaspete": [],
        "Măcelărie/Lactate": [],
        "Măcelărie/Pește": [],
        "Măcelărie/Băcănie": [],
        "Pește/Băcănie": []
    };
    
    let shoppingListEN = [];

    nutrients.forEach(n => {
        let scanned = (Math.random() * n.opt).toFixed(1);
        if(n.u === '%') scanned = Math.floor(Math.random() * 60) + 30;
        
        let diff = (n.opt - scanned).toFixed(1);
        if(diff < 0) diff = 0;

        if(diff > 0) {
            let linieText = `${n[curLang]}: +${diff}${n.u} (${n['f_' + curLang]})`;
            
            if(curLang === 'ro') {
                let cat = n.cat_ro || "Altele";
                if(!categorii[cat]) categorii[cat] = [];
                categorii[cat].push(linieText);
            } else {
                shoppingListEN.push(linieText);
            }
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="text-align:left; font-weight:bold;">${n[curLang]}</td>
            <td>${n.opt} ${n.u}</td>
            <td style="color:#ffcc00">${scanned} ${n.u}</td>
            <td style="color:${diff > 0 ? 'var(--red)':'var(--green)'}; font-weight:bold;">${diff > 0 ? diff + ' ' + n.u : 'OK'}</td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById('t-wrap').style.display = 'block';
    document.getElementById('actions').style.display = 'grid';

    // Generarea stabila a structurii mesajului pe Raioane
    let textFinalShop = "";
    if(curLang === 'ro') {
        textFinalShop = `🧬 AOH-FOD V1100 PRO - LISTĂ CUMPĂRĂTURI\n\n`;
        for (let raion in categorii) {
            if (categorii[raion].length > 0) {
                textFinalShop += `🛒 RAION: ${raion.toUpperCase()}\n`;
                categorii[raion].forEach(item => {
                    textFinalShop += ` ▪ ${item}\n`;
                });
                textFinalShop += `\n`;
            }
        }
    } else {
        textFinalShop = `🧬 AOH-FOD V1100 PRO - SHOPPING LIST\n\n` + shoppingListEN.join('\n');
    }
    
    const menuText = encodeURIComponent(`Generează un meniu personalizat dinamic pentru Deva Tenis Club bazat pe deficitul scanat.`);
    
    document.getElementById('w-shop').href = `https://wa.me{encodeURIComponent(textFinalShop)}`;
    document.getElementById('w-cook').href = `https://wa.me{menuText}`;
}

function tgl(id) {
    const p = document.getElementById(id);
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
}
</script>
