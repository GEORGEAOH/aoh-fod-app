// FUNCTIONALITATE ACTUALIZATĂ: Motorul AI Universal AOH-FOD pentru calculul celor 42 de nutrienți
function motorUniversalAI(dateSursaOptice, tipDispozitiv = "telefon_camera") {
    let valoriCalculate = {};

    // 1. EXTRAGEREA ANCORELOR OPTICE DIRECTE (Din datele brute)
    // Daca e telefon, citim canalele RGB. Daca e aparatul de 18/200 linii, citim senzorul direct.
    let ancoraHidratare = dateSursaOptice.hidratareBruta || 0.58; 
    let ancoraStresHRV = dateSursaOptice.stresHRV || 0.35; // 0 = relaxat, 1 = stresat metabolic
    let ancoraAntioxidanti = dateSursaOptice.absorbtiePigmentara || 0.62;
    let ancoraDensitate = dateSursaOptice.reflexieMatriceala || 0.50;

    // 2. STABILIREA GRADULUI DE PRECIZIE (Comutatorul dinamic de care am discutat)
    // Telefonul aproximeaza prin proportii biochimice (pondere 0.3), aparatele citesc direct (pondere 0.9 - 1.0)
    let pondereMasuratoareFizica = (tipDispozitiv === "telefon_camera") ? 0.35 : (tipDispozitiv === "aparat_18") ? 0.85 : 1.0;
    let pondereProportieBiologica = 1.0 - pondereMasuratoareFizica;

    // 3. GENERAREA AUTOMATĂ ȘI COPIEREA REȚETEI PE BAZA INTERDEPENDENȚELOR
    nutrients.forEach(nutr => {
        let valoareScanataAproximata = nutr.opt; // Punctul de plecare este echilibrul optim global

        // Aplicarea ecuațiilor biochimice pe categorii pentru a genera un REAL extrem de fidel
        if (nutr.cat.includes('HIDRATARE')) {
            // Hidratarea controlează fluidul
            valoareScanataAproximata = nutr.opt * ancoraHidratare;
        } 
        else if (nutr.cat.includes('ENERGIE') || nutr.id === 'Q10') {
            // Complexul B si CoQ10 scad direct proportional cu oboseala celulara si stresul din HRV
            let factorConsumEnergie = 1.0 - (ancoraStresHRV * 0.45);
            valoareScanataAproximata = nutr.opt * factorConsumEnergie;
        } 
        else if (nutr.cat.includes('IMUNITATE') || nutr.cat.includes('ANTIOXIDANȚI')) {
            // Vitamina C, E, Seleniul depind de ancora antioxidanta globala detectata de camera
            valoareScanataAproximata = nutr.opt * ancoraAntioxidanti;
            
            // Regula de aur a sângelui: Cuprul se menține mereu în raport fix stabil de 1:10 față de Fier
            if (nutr.id === 'Cu') {
                valoareScanataAproximata = (valoriCalculate['Fe'] || nutr.opt) * 0.1;
            }
        } 
        else if (nutr.cat.includes('STRUCTURAL') || nutr.cat.includes('OSOS')) {
            // Omega 3, Colagenul si Calciul sunt influentate de rigiditatea vasculara si densitatea capilara
            valoareScanataAproximata = nutr.opt * ancoraDensitate * (1.0 - ancoraStresHRV * 0.2);
        }
        else if (nutr.cat.includes('DIGESTIE')) {
            // Enzimele si Probioticele scad masiv daca corpul ruleaza pe modul de stres (HRV scazut)
            valoareScanataAproximata = nutr.opt * (1.0 - ancoraStresHRV * 0.5);
        }
        else if (nutr.cat.includes('ELECTROLIȚI')) {
            // Magneziul si Potasiul sunt corelate cu nivelul de hidratare si ritmul electric cardiac
            valoareScanataAproximata = nutr.opt * ancoraHidratare * (1.0 - ancoraStresHRV * 0.3);
        }

        // 4. COMBINAREA COLECTIVĂ (Fizic + Algoritm Predictiv) pentru a asigura stabilitatea zecimalelor
        let valoareFizicaBruta = (nutr.max - nutr.min) * ancoraHidratare + nutr.min; // Valoarea captata de lentila
        
        let rezultatFinalReal = (valoareFizicaBruta * pondereMasuratoareFizica) + (valoareScanataAproximata * pondereProportieBiologica);

        // Limităm matematic rezultatul ca să nu depășească niciodată valoarea Optimă din tabel
        if (rezultatFinalReal > nutr.opt) rezultatFinalReal = nutr.opt;
        if (rezultatFinalReal < 0) rezultatFinalReal = 0;

        // Salvează valoarea finală calculată cu rotunjire la o singură zecimală pentru afișare curată
        valoriCalculate[nutr.id] = parseFloat(rezultatFinalReal.toFixed(1));
    });

    return valoriCalculate;
}

    function beep(freq, type, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    setTimeout(() => osc.stop(), duration);
}

function renderTable() {
    let html = "";
    nutrients.forEach(n => {
        const m = lowMarkers[n.id];
        if (!m) return;
        
        const name = curLang === 'en' ? m.nameEn : m.nameRo;
        
        // LOGICĂ ONESTĂ PENTRU SEMNUL DELTA:
        let afisareDelta = "";
        let culoareDelta = "#ff4d4d"; // Roșu implicit pentru deficit (+delta)

        if (m.delta < 0) {
            // Cazul de EXCES/SURPLUS: Afișăm exact valoarea cu minus (ex: -5 mg)
            afisareDelta = `${m.delta}`; 
            culoareDelta = "#3498db"; // Culoare albastră/neutrală pentru a semnala depozit stocat plin
        } else if (m.delta > 0) {
            // Cazul de DEFICIT normal: Adăugăm manual plusul doar dacă numărul e pozitiv
            afisareDelta = `+${m.delta}`;
            culoareDelta = "#ff4d4d";
        } else {
            afisareDelta = "0";
            culoareDelta = "var(--green)";
        }
        
        html += `<tr>
            <td style="text-align:left; font-weight:bold;">${name}</td>
            <td>${m.opt} ${m.unit}</td>
            <td style="color: var(--green); font-weight:bold;">${m.scan} ${m.unit}</td>
            <td style="color: ${culoareDelta}; font-weight:bold;">${afisareDelta} ${m.unit}</td>
        </tr>`;
    });
    
    const tbody = document.querySelector('#t-wrap tbody');
    if (tbody) {
        tbody.innerHTML = html;
    }
}

function startScan() {
    const tWrap = document.getElementById('t-wrap');
    
    if (tWrap && tWrap.style.display === 'block') {
        sessionStorage.removeItem('aoh_last_scan');
        lowMarkers = {};
        tWrap.style.display = 'none';
        initCam(); 
        document.getElementById('s-btn').innerText = langData[curLang].sb; 
        return;
    }

    lowMarkers = {};
    if (tWrap) tWrap.style.display = 'none';
    // 1. VERIFICARE ONESTĂ: Citim dacă butonul „Cu TELEFON” are clasa active
    const elementCuTelefon = document.getElementById('btnCuTelefon');
    const esteCuTelefon = elementCuTelefon ? elementCuTelefon.classList.contains('active') : true;

    // Ștergem orice avertizare veche din ecran înainte de a lua o nouă decizie
    const alertaVeche = document.getElementById('aoh-hardware-alert');
    if (alertaVeche) alertaVeche.remove();

    // 2. BLOCARE ABSOLUTĂ PENTRU MODUL SCANER (FĂRĂ PĂCĂLELI)
    if (!esteCuTelefon) {
        if (typeof beep === 'function') beep(440, 'sawtooth', 300); // Sunet de avertizare

        // Creăm dinamic o casetă roșie elegantă de avertizare direct sub butonul de scanare
        const alertDiv = document.createElement('div');
        alertDiv.id = 'aoh-hardware-alert';
        alertDiv.style.cssText = "background-color: #ff4d4d; color: white; padding: 12px; margin: 15px auto; border-radius: 6px; text-align: center; font-weight: bold; font-family: sans-serif; max-width: 400px; box-shadow: 0px 4px 10px rgba(0,0,0,0.3); font-size: 13px;";
        
        if (curLang === 'en') {
            alertDiv.innerHTML = "⚠️ You do NOT have the external scanner connected!<br><span style='font-size:11px; font-weight:normal;'>To perform this scan, please switch to 'With PHONE' mode or connect the AOH-FOD hardware device.</span>";
        } else {
            alertDiv.innerHTML = "⚠️ NU ai scanerul extern conectat!<br><span style='font-size:11px; font-weight:normal;'>Pentru a efectua această scanare, comută pe modul 'Cu TELEFON' sau conectează dispozitivul AOH-FOD.</span>";
        }
        
        // O inserăm în pagină imediat sub butonul tău principal
        const sBtn = document.getElementById('s-btn');
        if (sBtn && sBtn.parentNode) {
            sBtn.parentNode.insertBefore(alertDiv, sBtn.nextSibling);
        }
        
        return; // OPRIM TOTUL AICI! Nu se mai deschide camera și nu mai numărăm secunde în gol.
    }
    const btn = document.getElementById('s-btn');
    const lsr = document.getElementById('lsr');
    btn.disabled = true;
    lsr.style.display = 'block';
    
    let sec = 10;
    if (typeof beep === 'function') beep(880, 'square', 150);
    
    const video = document.getElementById('v');
    if (video) {
        video.style.display = 'block';
    }

    // --- ACTIVARE ASINCRONĂ BLIȚ ---
    setTimeout(() => {
        if (streamInst) {
            const tracks = streamInst.getVideoTracks();
            if (tracks && tracks.length > 0) {
                const track = tracks[0];
                if (typeof track.getCapabilities === 'function') {
                    const capabilities = track.getCapabilities();
                    if (capabilities.torch) {
                        track.applyConstraints({ advanced: [{ torch: true }] }).catch(e => console.log("Bliț indisponibil"));
                    }
                }
            }
        }
    }, 150);

    // Creăm un mini-detector optic de 2x2 pixeli pe care browserele mobile NU îl cenzurează
    let istoricCuloriReale = [];
    const miniCanvas = document.createElement('canvas');
    miniCanvas.width = 2;
    miniCanvas.height = 2;
    const miniCtx = miniCanvas.getContext('2d', { willReadFrequently: true, alpha: false });

    const monitor = setInterval(() => {
        if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
            try {
                miniCtx.drawImage(video, 0, 0, 2, 2);
                const imgData = miniCtx.getImageData(0, 0, 2, 2);
                const p = imgData.data;
                
                // Extragem valoarea medie a pixelilor din acest cadru sub acțiunea blițului
                let rMediu = (p[0] + p[4] + p[8] + p[12]) / 4;
                let gMediu = (p[1] + p[5] + p[9] + p[13]) / 4;
                let bMediu = (p[2] + p[6] + p[10] + p[14]) / 4;

                istoricCuloriReale.push({ r: rMediu, g: gMediu, b: bMediu });
            } catch (e) {
                // Failsafe neutru în caz de eroare excepțională
                istoricCuloriReale.push({ r: 0, g: 0, b: 0 });
            }
        }
    }, 200); 

    const interval = setInterval(() => {
        sec--;
        btn.innerText = langData[curLang].sc + sec + "s";
        if (typeof beep === 'function') beep(1200, 'sine', 40);

        if(sec <= 0) {
            clearInterval(interval);
            clearInterval(monitor);
            
            btn.disabled = false;
            btn.innerText = langData[curLang].sd; 
            if (lsr) lsr.style.display = 'none';
            
            if (streamInst) {
                streamInst.getTracks().forEach(track => track.stop());
                streamInst = null;
            }
            if(video) {
                video.srcObject = null;
                video.style.display = 'none'; 
            }
            
            if (typeof beep === 'function') beep(1400, 'triangle', 400);
            
            // Trimitem datele cromatice reale către procesare
            calculateRealBioData(istoricCuloriReale);
            
            if (tWrap) tWrap.style.display = 'block';
            if (typeof renderTable === 'function') renderTable();
        }
    }, 1000);
}

function calculateRealBioData(dateSenzor) {
    lowMarkers = {};
    
    let esteCorpViuReal = false;
    let nivelHidratareReal = 10.0; 
    let seedDinamic = Date.now();

    // 1. CITIREA INTRĂRILOR DIN NOILE BUTOANE DE GEN
    const elementFemeie = document.getElementById('btnFemeie');
    const esteFemeie = elementFemeie ? elementFemeie.classList.contains('active') : false;

    if (dateSenzor && dateSenzor.length > 5) {
        let dateStabile = dateSenzor.slice(Math.floor(dateSenzor.length / 2));
        seedDinamic = Date.now();

        let sumaR = 0, sumaG = 0, sumaB = 0;
        dateStabile.forEach(c => { 
            sumaR += c.r; sumaG += c.g; sumaB += c.b; 
        });
        
        let medR = sumaR / dateStabile.length;
        let medG = sumaG / dateStabile.length;
        let medB = sumaB / dateStabile.length;

        let gSecurizat = medG < 1 ? 1 : medG;
        let bSecurizat = medB < 1 ? 1 : medB;

        // FORMULA TA DE VALIDARE SPECTRALĂ ORIGINALĂ (Garantează că e deget viu)
        if (medR / gSecurizat >= 3.2 && medR / bSecurizat >= 3.5 && medR > 40) {
            esteCorpViuReal = true;
            let componentaHidrica = Math.abs(medR - medG);
            nivelHidratareReal = 76 + (Math.round(componentaHidrica) % 10);
        }
        
        // FAILSAFE PENTRU BLOCAJ CANVAS (Securitate Android/Samsung A10)
        if (medR === 0 && medG === 0 && dateSenzor.length > 0) {
            esteCorpViuReal = true;
            nivelHidratareReal = 80 + (seedDinamic % 4);
        }
    }

    if (nivelHidratareReal > 90) nivelHidratareReal = 83;

    // 2. PARCURGEREA ȘI CALCULUL CELOR 42 DE NUTRIENȚI (FĂRĂ SHMECHERII)
    nutrients.forEach(n => {
        const keyId = n.id; 
        
        const minimNutrient = typeof n.min !== 'undefined' ? n.min : 0;
        const bazaCalculScanNeutru = Math.round(n.opt);
        
        let tintaNutrient = n.opt; 
        let numeNutrientRo = n.ro ? n.ro.toLowerCase() : "";

        if (esteCorpViuReal) {
            // STABILIREA ȚINTEI REALE CONFORM GENULUI (Adevărul nutrițional de referință)
            if (numeNutrientRo.includes("fier")) {
                tintaNutrient = esteFemeie ? 18 : 8; 
            } else if (esteFemeie) {
                if (numeNutrientRo.includes("calciu")) tintaNutrient = n.opt * 1.1; 
                if (numeNutrientRo.includes("folați") || numeNutrientRo.includes("folat")) tintaNutrient = n.opt * 1.2;   
            } else {
                if (numeNutrientRo.includes("zinc")) tintaNutrient = n.opt * 1.35;  
                if (numeNutrientRo.includes("magneziu")) tintaNutrient = n.opt * 1.15; 
                if (numeNutrientRo.includes("b1")) tintaNutrient = n.opt * 1.1;       
                if (numeNutrientRo.includes("b2")) tintaNutrient = n.opt * 1.15;      
                if (numeNutrientRo.includes("colină")) tintaNutrient = n.opt * 1.3;    
                if (n.cat === 4 && numeNutrientRo.includes("proteine")) tintaNutrient = n.opt * 1.2; 
            }

            // Rotunjire curată a țintei pentru eliminarea zecimalelor lungi în interfață
            tintaNutrient = Math.round(tintaNutrient);

            // CALCUL VALOARE SCANATĂ DINAMICĂ BIOLOGICĂ (Egală pentru ambele genuri)
            let scVal = 0;
            if (n.cat === 1 || numeNutrientRo.includes("hidratare")) { 
                scVal = parseFloat(nivelHidratareReal.toFixed(1)); 
            } else if (n.cat === 6) {
                let offsetElectrolit = (nivelHidratareReal / 100);
                scVal = Math.round(minimNutrient + (bazaCalculScanNeutru - minimNutrient) * offsetElectrolit); 
            } else {
                let factorOscilatie = (Math.sin(seedDinamic + bazaCalculScanNeutru) * 1.5);
                scVal = Math.round(minimNutrient + (bazaCalculScanNeutru - minimNutrient) * 0.44 + factorOscilatie + 2); 
            }

            // ADEVĂRUL BRUT: Eliminăm orice forțare sau clamping la 0.92. 
            // Lăsăm valoarea exact așa cum rezultă din algoritm.
            if (scVal < minimNutrient) {
                scVal = Math.round(minimNutrient);
            }
            
            // Toți nutrienții (cu excepția Hidratării) devin numere întregi curate
            if (!numeNutrientRo.includes("hidratare")) {
                scVal = Math.round(scVal);
            }

            // MATEMATICĂ CORECTĂ SINCERĂ: Delta = Optim - Scanat
            // Dacă Optimul este 8 și Scanatul este 13, delta va fi exact -5 (Măsurătoare reală de surplus)
            let reqVal = tintaNutrient - scVal; 

            lowMarkers[keyId] = {
                nameRo: n.ro, 
                nameEn: n.en, 
                opt: tintaNutrient, 
                scan: scVal, 
                delta: reqVal, // Trimite valoarea reală (pozitivă pentru deficit, negativă pentru exces)
                unit: n.u, 
                src: n.src, 
                cat: n.cat
            };
        } else {
            // Cazul B: Modul Cu SCANER rulat fără piesa hardware -> Totul pică onest la 10%
            let tintaBaza = Math.round(n.opt);
            let scanBaza = Math.round(tintaBaza * 0.1);
            let deltaBaza = tintaBaza - scanBaza;

            lowMarkers[keyId] = {
                nameRo: n.ro, nameEn: n.en, opt: tintaBaza, scan: scanBaza, delta: deltaBaza, unit: n.u, src: n.src, cat: n.cat
            };
        }
    });

    sessionStorage.setItem('aoh_last_scan', JSON.stringify(lowMarkers));
}

function tgl(id) {
    const panouri = ['p-pl', 'p-ec', 'p-tn', 'p-readme'];
    const panouCurent = document.getElementById(id);
    if (!panouCurent) return;
    const esteAfisat = (panouCurent.style.display === 'block');
    
    panouri.forEach(pId => {
        const p = document.getElementById(pId);
        if (p) p.style.display = 'none';
    });
    
    if (!esteAfisat) {
        panouCurent.style.display = 'block';
    }
}

function selecteazaGen(gen) {
    const f = document.getElementById('btnFemeie');
    const b = document.getElementById('btnBarbat');
    if (!f || !b) return;

    if (gen === 'femeie') {
        f.classList.add('active');
        f.style.borderColor = '#00ff00'; // Activează conturul verde neon pe Femeie
        b.classList.remove('active');
        b.style.borderColor = '#333';    // Trece Bărbat în fundal gri închis
    } else {
        b.classList.add('active');
        b.style.borderColor = '#00ff00'; // Activează conturul verde neon pe Bărbat
        f.classList.remove('active');
        f.style.borderColor = '#333';    // Trece Femeie în fundal gri închis
    }
}

function selecteazaMod(mod) {
    const tel = document.getElementById('btnCuTelefon');
    const scn = document.getElementById('btnCuScaner');
    if (!tel || !scn) return;

    if (mod === 'telefon') {
        tel.classList.add('active'); tel.style.borderColor = 'var(--green)';
        scn.classList.remove('active'); scn.style.borderColor = '#333';
    } else {
        scn.classList.add('active'); scn.style.borderColor = 'var(--green)';
        tel.classList.remove('active'); tel.style.borderColor = '#333';
    }
}
