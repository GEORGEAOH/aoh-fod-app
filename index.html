async function initCam() {
    try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        document.getElementById('v').srcObject = s;
    } catch (e) { alert(langData[curLang].err); }
}

function tgl(id) {
    const p = document.getElementById(id);
    const d = p.style.display === 'block' ? 'none' : 'block';
    document.querySelectorAll('.panel').forEach(x => x.style.display = 'none');
    p.style.display = d;
}

function beep(freq, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function startScan() {
    const sBtn = document.getElementById('s-btn');
    const lsr = document.getElementById('lsr');
    sBtn.disabled = true;
    lsr.style.display = 'block';
    
    let sec = 10;
    beep(880, 0.1);
    
    const iv = setInterval(() => {
        sec--;
        sBtn.innerText = langData[curLang].sc + sec + "S";
        beep(440, 0.05);
        if(sec <= 0) {
            clearInterval(iv);
            lsr.style.display = 'none';
            sBtn.innerText = langData[curLang].sd;
            beep(1200, 0.3);
            setTimeout(() => { sBtn.innerText = langData[curLang].sb; sBtn.disabled = false; }, 2000);
            genRes();
        }
    }, 1000);
}

function genRes() {
    bioHistory = nutrients.map(n => {
        let sc = +(Math.random() * (n.opt * 0.65) + (n.opt * 0.1)).toFixed(1);
        if (n.u === '%') sc = +(Math.random() * 30 + 35).toFixed(1);
        let df = +(n.opt - sc).toFixed(1);
        if (df < 0) df = 0;
        return { ...n, sc, df };
    });
    renderTable();
    updateWhatsAppLinks();
}

function renderTable() {
    const b = document.getElementById('res-b');
    b.innerHTML = '';
    let curGr = '';
    
    bioHistory.forEach(n => {
        const gr = curLang === 'ro' ? n.gr_ro : n.gr_en;
        const name = curLang === 'ro' ? n.ro : n.en;
        
        if (gr !== curGr) {
            curGr = gr;
            const r = document.createElement('tr');
            r.innerHTML = `<td colspan="4" style="background:#111; color:var(--green); font-weight:bold; text-align:left; padding:6px 5px; font-size:0.6rem;">${curGr}</td>`;
            b.appendChild(r);
        }
        
        const r = document.createElement('tr');
        r.innerHTML = `
            <td style="text-align:left; font-weight:bold;">${name}</td>
            <td style="color:#aaa;">${n.opt}${n.u}</td>
            <td style="color:#ffaa00;">${n.sc}${n.u}</td>
            <td style="color:var(--red); font-weight:bold;">+${n.df}${n.u}</td>
        `;
        b.appendChild(r);
    });
    document.getElementById('t-wrap').style.display = 'block';
}
